name: build-apk

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::서명 키 Secrets가 없어 컴파일 확인용 debug 빌드만 합니다 (Release 등록 안 함)."
            echo "HAS_KEY=false" >> "$GITHUB_ENV"
          else
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "HAS_KEY=true" >> "$GITHUB_ENV"
          fi

      - name: Build debug APK (no key)
        if: env.HAS_KEY == 'false'
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Build release APK
        if: env.HAS_KEY == 'true'
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        if: env.HAS_KEY == 'true'
        run: cp app/build/outputs/apk/release/app-release.apk "hskStudy-v0.1.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        if: env.HAS_KEY == 'true'
        with:
          name: hskStudy-v0.1.${{ github.run_number }}
          path: hskStudy-v0.1.${{ github.run_number }}.apk

      - uses: softprops/action-gh-release@v2
        if: env.HAS_KEY == 'true'
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: hskStudy v0.1.${{ github.run_number }}
          files: hskStudy-v0.1.${{ github.run_number }}.apk
          body: "${{ github.event.head_commit.message }}"
